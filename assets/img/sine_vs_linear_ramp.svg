<svg xmlns="http://www.w3.org/2000/svg" width="620" height="260" viewBox="0 0 620 260" role="img" aria-labelledby="title desc">
  <title id="title">Sine vs linear accel/decel ramp</title>
  <desc id="desc">Comparison of a sinusoidal half-sine ramp with a linear trapezoid ramp, showing the longer sine ramp time for the same peak speed and acceleration.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .axis { stroke: #334155; stroke-width: 2; }
      .grid { stroke: #cbd5e1; stroke-width: 1; }
      .sine { fill: none; stroke: #2563eb; stroke-width: 3; }
      .linear { fill: none; stroke: #dc2626; stroke-width: 3; stroke-dasharray: 10 7; }
      .label { font: 16px sans-serif; fill: #0f172a; }
      .small { font: 13px sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect class="bg" width="620" height="260"/>
  <line class="axis" x1="70" y1="30" x2="70" y2="210"/>
  <line class="axis" x1="70" y1="210" x2="570" y2="210"/>

  <line class="grid" x1="70" y1="70" x2="570" y2="70"/>
  <line class="grid" x1="70" y1="130" x2="570" y2="130"/>
  <line class="grid" x1="70" y1="190" x2="570" y2="190"/>

  <path class="sine" d="M 70 210 C 120 210, 170 110, 220 80 C 270 50, 330 50, 370 80 C 420 110, 470 210, 570 210"/>
  <path class="linear" d="M 70 210 L 220 210 L 220 70 L 370 70 L 370 210 L 570 210"/>

  <text class="label" x="250" y="40">sine</text>
  <text class="label" x="330" y="170">linear</text>
  <text class="small" x="18" y="115" transform="rotate(-90 18 115)">velocity</text>
  <text class="small" x="300" y="246">time</text>
  <text class="small" x="56" y="226">0</text>
  <text class="small" x="556" y="226">T</text>
</svg>
