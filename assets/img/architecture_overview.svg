<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1100" height="540" viewBox="0 0 1100 540"
     role="img" aria-labelledby="title description">
  <title id="title">SliderCtrl + SliderMC architecture</title>
  <desc id="description">Replaceable orange UIC (panel plus UIC Pico) talks UART or USB to a replaceable cyan SliderMC (MC Pico plus motors, servos, limits, camera). Same motion board, any panel face, or the other way around.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101c"/>
      <stop offset="1" stop-color="#0f1b2d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="0.5" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="uicChip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="mcChip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.6"/>
    </pattern>
    <filter id="glow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.2 L 10 5 L 0 8.8 z" fill="#fdba74"/>
    </marker>
    <marker id="arrCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.2 L 10 5 L 0 8.8 z" fill="#67e8f9"/>
    </marker>
    <marker id="arrBoth" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.2 L 10 5 L 0 8.8 z" fill="#e2e8f0"/>
    </marker>
  </defs>

  <rect width="1100" height="540" fill="url(#bgGrad)"/>
  <rect width="1100" height="540" fill="url(#grid)" opacity="0.4"/>
  <rect x="0" y="0" width="1100" height="6" fill="url(#accent)"/>

  <text x="32" y="36" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="22" font-weight="800" fill="#f8fafc">Split stack</text>
  <text x="168" y="36" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="15" font-weight="600" fill="#94a3b8">swap the UIC or the MC  ·  same contract</text>
  <text x="1068" y="34" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="12" fill="#64748b">STEP timing never shares the UI CPU</text>

  <!-- Orange L: panel stem + UIC Pico foot -->
  <g filter="url(#glow)">
    <path d="M 28 58
             h 244
             v 220
             h 152
             v 168
             h -396
             z"
          fill="#2a1408" stroke="#ea580c" stroke-width="1.6"/>
  </g>
  <rect x="28" y="58" width="244" height="8" rx="4" fill="#f97316"/>
  <text x="150" y="88" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="13" font-weight="700" letter-spacing="1.6" fill="#fdba74">ON THE PANEL</text>

  <!-- Cyan L: axis stem + MC Pico foot -->
  <g filter="url(#glow)">
    <path d="M 816 58
             h 244
             v 388
             h -396
             v -168
             h 152
             z"
          fill="#042f2e" stroke="#22d3ee" stroke-width="1.6"/>
  </g>
  <rect x="816" y="58" width="244" height="8" rx="4" fill="#22d3ee"/>
  <text x="938" y="88" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="13" font-weight="700" letter-spacing="1.6" fill="#a5f3fc">ON THE AXIS</text>

  <!-- Panel I/O in the orange stem -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff7ed">
    <g filter="url(#soft)">
      <rect x="44" y="104" width="212" height="36" rx="8" fill="#c2410c"/>
      <rect x="44" y="148" width="212" height="36" rx="8" fill="#9a3412"/>
      <rect x="44" y="192" width="212" height="36" rx="8" fill="#c2410c"/>
      <rect x="44" y="236" width="212" height="36" rx="8" fill="#9a3412"/>
      <rect x="44" y="292" width="212" height="36" rx="8" fill="#c2410c"/>
      <rect x="44" y="336" width="212" height="36" rx="8" fill="#9a3412"/>
    </g>
    <text x="150" y="127" text-anchor="middle">Buttons</text>
    <text x="150" y="171" text-anchor="middle">Keypad</text>
    <text x="150" y="215" text-anchor="middle">OLED</text>
    <text x="150" y="259" text-anchor="middle">RGB LED</text>
    <text x="150" y="315" text-anchor="middle">Pots / SPEED · ACCEL</text>
    <text x="150" y="359" text-anchor="middle">Joysticks</text>
  </g>
  <text x="150" y="424" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="11" fill="#fdba74">JKSlider  ·  B4Slider  ·  your face</text>

  <!-- UIC Pico in the orange foot -->
  <g filter="url(#soft)">
    <rect x="284" y="290" width="128" height="140" rx="12" fill="url(#uicChip)"/>
    <rect x="296" y="302" width="26" height="10" rx="2" fill="#ffedd5" opacity="0.35"/>
  </g>
  <text x="348" y="340" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="16" font-weight="800" fill="#fff7ed">UIC Pico</text>
  <text x="348" y="362" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="12" fill="#ffedd5">SliderCtrl</text>
  <text x="348" y="380" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="12" fill="#ffedd5">MicroPython</text>
  <text x="348" y="404" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="11" fill="#fed7aa">optional WLAN</text>

  <!-- UART / USB hub: the swap contract -->
  <g filter="url(#glow)">
    <rect x="434" y="248" width="220" height="196" rx="18" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <text x="544" y="286" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="18" font-weight="800" fill="#f8fafc">UART / USB</text>
  <text x="544" y="314" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="14" font-weight="600" fill="#e2e8f0">115 200 baud</text>
  <text x="544" y="340" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="13" fill="#94a3b8">crossed TX · RX · GND</text>
  <text x="544" y="362" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="13" fill="#94a3b8">4-wire remote or USB</text>
  <line x1="434" y1="360" x2="412" y2="360" stroke="#e2e8f0" stroke-width="2.6" marker-end="url(#arrBoth)"/>
  <line x1="654" y1="360" x2="676" y2="360" stroke="#e2e8f0" stroke-width="2.6" marker-end="url(#arrBoth)"/>
  <text x="544" y="400" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="12" font-weight="700" fill="#fdba74">swap this UIC</text>
  <text x="544" y="420" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="12" font-weight="700" fill="#67e8f9">or swap this MC</text>

  <!-- MC Pico in the cyan foot -->
  <g filter="url(#soft)">
    <rect x="676" y="290" width="128" height="140" rx="12" fill="url(#mcChip)"/>
    <rect x="688" y="302" width="26" height="10" rx="2" fill="#ecfeff" opacity="0.4"/>
  </g>
  <text x="740" y="340" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="16" font-weight="800" fill="#083344">MC Pico</text>
  <text x="740" y="362" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="12" fill="#ecfeff">SliderMC</text>
  <text x="740" y="380" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="12" fill="#ecfeff">C++ / PIO STEP</text>
  <text x="740" y="404" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="11" fill="#cffafe">USB CLI debug</text>

  <!-- Axis I/O in the cyan stem -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ecfeff">
    <g filter="url(#soft)">
      <rect x="832" y="104" width="212" height="36" rx="8" fill="#0e7490"/>
      <rect x="832" y="148" width="212" height="36" rx="8" fill="#155e75"/>
      <rect x="832" y="192" width="212" height="36" rx="8" fill="#0e7490"/>
      <rect x="832" y="236" width="212" height="36" rx="8" fill="#155e75"/>
      <rect x="832" y="292" width="212" height="36" rx="8" fill="#0e7490"/>
      <rect x="832" y="336" width="212" height="36" rx="8" fill="#155e75"/>
    </g>
    <text x="938" y="122" text-anchor="middle">Motors 1–3</text>
    <text x="938" y="136" text-anchor="middle" font-size="10" font-weight="500" fill="#a5f3fc">STEP / DIR / EN</text>
    <text x="938" y="166" text-anchor="middle">Servos</text>
    <text x="938" y="180" text-anchor="middle" font-size="10" font-weight="500" fill="#a5f3fc">PWM · packed axes</text>
    <text x="938" y="209" text-anchor="middle">Hard limits</text>
    <text x="938" y="223" text-anchor="middle" font-size="10" font-weight="500" fill="#a5f3fc">also the homing reference</text>
    <text x="938" y="254" text-anchor="middle">Camera · CT</text>
    <text x="938" y="268" text-anchor="middle" font-size="10" font-weight="500" fill="#a5f3fc">PIN_CAMERA_CTRL</text>
    <text x="938" y="315" text-anchor="middle">Ext</text>
    <text x="938" y="359" text-anchor="middle">EMO · DRV_ERROR</text>
  </g>
  <text x="938" y="424" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="11" fill="#a5f3fc">EXT_*  ·  BE  ·  SliderMC</text>

  <!-- Orange collector: panel items into UIC Pico -->
  <path d="M 256 122 H 264" fill="none" stroke="#fdba74" stroke-width="1.5"/>
  <path d="M 256 166 H 264" fill="none" stroke="#fdba74" stroke-width="1.5"/>
  <path d="M 256 210 H 264" fill="none" stroke="#fdba74" stroke-width="1.5"/>
  <path d="M 256 254 H 264" fill="none" stroke="#fdba74" stroke-width="1.5"/>
  <path d="M 256 310 H 264" fill="none" stroke="#fdba74" stroke-width="1.5"/>
  <path d="M 256 354 H 264" fill="none" stroke="#fdba74" stroke-width="1.5"/>
  <path d="M 264 122 V 360" fill="none" stroke="#fdba74" stroke-width="1.6"/>
  <path d="M 264 360 H 284" fill="none" stroke="#fdba74" stroke-width="1.8" marker-end="url(#arrOrange)"/>

  <!-- Cyan distributor: MC Pico into axis items -->
  <path d="M 804 360 H 812" fill="none" stroke="#67e8f9" stroke-width="1.8"/>
  <path d="M 812 122 V 360" fill="none" stroke="#67e8f9" stroke-width="1.6"/>
  <path d="M 812 122 H 832" fill="none" stroke="#67e8f9" stroke-width="1.5" marker-end="url(#arrCyan)"/>
  <path d="M 812 166 H 832" fill="none" stroke="#67e8f9" stroke-width="1.5" marker-end="url(#arrCyan)"/>
  <path d="M 812 210 H 832" fill="none" stroke="#67e8f9" stroke-width="1.5" marker-end="url(#arrCyan)"/>
  <path d="M 812 254 H 832" fill="none" stroke="#67e8f9" stroke-width="1.5" marker-end="url(#arrCyan)"/>
  <path d="M 812 310 H 832" fill="none" stroke="#67e8f9" stroke-width="1.5" marker-end="url(#arrCyan)"/>
  <path d="M 812 354 H 832" fill="none" stroke="#67e8f9" stroke-width="1.5" marker-end="url(#arrCyan)"/>

  <text x="550" y="512" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="12" fill="#94a3b8">Shutter is SliderMC CT  ·  homing uses hard-limit or stall  ·  no UIC camera pin</text>
</svg>
