<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="132mm" height="176mm" viewBox="-18 -16 132 176"
     role="img" aria-labelledby="title description">
  <title id="title">Recommended discrete button layout</title>
  <desc id="description">A 96 by 144 millimetre front plate laid out on a 12 millimetre grid with a symbolic OLED, two potentiometers, one RGB LED, AXIS 1 to 6, twelve buttons, labels, and dimensions.</desc>

  <defs>
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M 12 0 L 0 0 0 12" fill="none" stroke="#b8c2cc" stroke-width="0.22"/>
    </pattern>
    <radialGradient id="rgbLed" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.22" stop-color="#61dafb"/>
      <stop offset="0.52" stop-color="#46d369"/>
      <stop offset="0.78" stop-color="#ffcf40"/>
      <stop offset="1" stop-color="#ef476f"/>
    </radialGradient>
    <marker id="arrowStart" markerWidth="5" markerHeight="5" refX="4.2" refY="2.5" orient="auto">
      <path d="M 5 0 L 0 2.5 L 5 5 z" fill="#344054"/>
    </marker>
    <marker id="arrowEnd" markerWidth="5" markerHeight="5" refX="0.8" refY="2.5" orient="auto">
      <path d="M 0 0 L 5 2.5 L 0 5 z" fill="#344054"/>
    </marker>
    <g id="button">
      <rect x="-6" y="-6" width="12" height="12" rx="1.25"
            fill="#f8fafc" stroke="#1f2937" stroke-width="0.7"/>
      <circle cx="0" cy="0" r="4.65" fill="#e8edf2" stroke="#697586" stroke-width="0.35"/>
      <circle cx="-1.35" cy="-1.35" r="1.05" fill="#ffffff" opacity="0.72"/>
    </g>
    <g id="axisButton">
      <rect x="-6" y="-6" width="12" height="12" rx="1.25"
            fill="#eef6ff" stroke="#1d4ed8" stroke-width="0.7"/>
      <circle cx="0" cy="0" r="4.65" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="0.35"/>
      <circle cx="-1.35" cy="-1.35" r="1.05" fill="#ffffff" opacity="0.72"/>
    </g>
    <g id="optionButton">
      <rect x="-6" y="-6" width="12" height="12" rx="1.25"
            fill="#fff8e6" stroke="#8a5a00" stroke-width="0.7"/>
      <circle cx="0" cy="0" r="4.65" fill="#ffd166" stroke="#a66b00" stroke-width="0.35"/>
      <circle cx="-1.35" cy="-1.35" r="1.05" fill="#ffffff" opacity="0.72"/>
    </g>
    <g id="stopButton">
      <rect x="-6" y="-6" width="12" height="12" rx="1.25"
            fill="#fff0f1" stroke="#9f1239" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="4.65" fill="#ef476f" stroke="#9f1239" stroke-width="0.4"/>
      <circle cx="-1.35" cy="-1.35" r="1.05" fill="#ffffff" opacity="0.66"/>
    </g>
    <g id="tButton">
      <rect x="-6" y="-6" width="12" height="12" rx="1.25"
            fill="#ecfeff" stroke="#0e7490" stroke-width="0.7"/>
      <circle cx="0" cy="0" r="4.65" fill="#67e8f9" stroke="#0e7490" stroke-width="0.35"/>
      <circle cx="-1.35" cy="-1.35" r="1.05" fill="#ffffff" opacity="0.72"/>
    </g>
    <g id="pot">
      <circle cx="0" cy="0" r="6" fill="#dde3e9" stroke="#1f2937" stroke-width="0.7"/>
      <circle cx="0" cy="0" r="4.65" fill="#667085" stroke="#344054" stroke-width="0.35"/>
      <path d="M 0 0 L 0 -3.7" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round"/>
      <circle cx="-1.45" cy="-1.45" r="0.9" fill="#ffffff" opacity="0.25"/>
    </g>
  </defs>

  <!-- Exact 8U x 12U front plate -->
  <rect x="0" y="0" width="96" height="144" rx="2"
        fill="#f7f9fb" stroke="#111827" stroke-width="1.1"/>
  <rect x="0" y="0" width="96" height="144" rx="2" fill="url(#grid)"/>

  <!-- Symbolic OLED above the RGB LED -->
  <rect x="30" y="12" width="36" height="12" rx="2"
        fill="#111827" stroke="#344054" stroke-width="0.7"/>
  <rect x="32" y="13.6" width="32" height="8.8" rx="1.2" fill="#0b1220"/>

  <!-- SPEED / RGB LED / ACCEL -->
  <use href="#pot" x="24" y="30"/>
  <circle cx="48" cy="30" r="2.5" fill="url(#rgbLed)" stroke="#344054" stroke-width="0.45"/>
  <circle cx="47.3" cy="29.3" r="0.65" fill="#ffffff" opacity="0.85"/>
  <use href="#pot" x="72" y="30"/>

  <!-- AXIS_1..6 above all buttons -->
  <use href="#axisButton" x="18" y="54"/>
  <use href="#axisButton" x="30" y="54"/>
  <use href="#axisButton" x="42" y="54"/>
  <use href="#axisButton" x="54" y="54"/>
  <use href="#axisButton" x="66" y="54"/>
  <use href="#axisButton" x="78" y="54"/>

  <!-- FAST / MOVE / STOP -->
  <use href="#button" x="18" y="78"/>
  <use href="#button" x="30" y="78"/>
  <use href="#stopButton" x="48" y="78"/>
  <use href="#button" x="66" y="78"/>
  <use href="#button" x="78" y="78"/>

  <!-- OPTION -->
  <use href="#optionButton" x="24" y="102"/>
  <use href="#optionButton" x="72" y="102"/>

  <!-- A B C T D -->
  <use href="#button" x="18" y="126"/>
  <use href="#button" x="30" y="126"/>
  <use href="#button" x="42" y="126"/>
  <use href="#tButton" x="60" y="126"/>
  <use href="#button" x="78" y="126"/>

  <!-- Labels -->
  <g fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="3.1"
     font-weight="700" text-anchor="middle">
    <text x="48" y="20.2" fill="#e5e7eb" font-size="3.2">OLED</text>

    <text x="24" y="39.2">SPEED</text>
    <text x="48" y="36.5" font-size="2.35" font-weight="600">RGB LED</text>
    <text x="72" y="39.2">ACCEL</text>

    <text x="18" y="65.8">1</text>
    <text x="30" y="65.8">2</text>
    <text x="42" y="65.8">3</text>
    <text x="54" y="65.8">4</text>
    <text x="66" y="65.8">5</text>
    <text x="78" y="65.8">6</text>

    <text x="18" y="89.8">&lt;&lt;</text>
    <text x="30" y="89.8">&lt;</text>
    <text x="48" y="89.8" font-size="2.75">STOP</text>
    <text x="66" y="89.8">&gt;</text>
    <text x="78" y="89.8">&gt;&gt;</text>

    <text x="24" y="113.8" font-size="2.65">OPTION</text>
    <text x="72" y="113.8" font-size="2.65">OPTION</text>

    <text x="18" y="137.8">A</text>
    <text x="30" y="137.8">B</text>
    <text x="42" y="137.8">C</text>
    <text x="60" y="137.8">T</text>
    <text x="78" y="137.8">D</text>
  </g>

  <!-- Plate and grid dimensions -->
  <g fill="none" stroke="#344054" stroke-width="0.35">
    <path d="M 0 148 L 0 154 M 96 148 L 96 154"/>
    <path d="M 1 152 L 95 152" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <path d="M -4 0 L -10 0 M -4 144 L -10 144"/>
    <path d="M -8 1 L -8 143" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
    <path d="M 0 -4 L 0 -10 M 12 -4 L 12 -10"/>
    <path d="M 1 -8 L 11 -8" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  </g>
  <g fill="#344054" font-family="Arial, Helvetica, sans-serif" font-size="3"
     text-anchor="middle">
    <text x="48" y="157">8U = 96 mm</text>
    <text x="6" y="-11">1U = 12 mm</text>
    <text x="-13" y="72" transform="rotate(-90 -13 72)">12U = 144 mm</text>
  </g>
</svg>
