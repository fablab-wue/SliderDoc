<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="190mm" height="125mm" viewBox="0 0 380 250"
     role="img" aria-labelledby="title description">
  <title id="title">Keypad 4 by 3 matrix wiring High-Z row scan</title>
  <desc id="description">Four by three keypad matrix with silk labels, rows wired directly to Pico GP6 to GP9 (High-Z idle scan), columns on GP10 to GP12.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfd"/>
      <stop offset="1" stop-color="#eef2f6"/>
    </linearGradient>
    <g id="key">
      <rect x="-14" y="-10" width="28" height="20" rx="3"
            fill="#f8fafc" stroke="#1f2937" stroke-width="1"/>
    </g>
  </defs>
  <rect x="0" y="0" width="380" height="250" rx="6" fill="url(#bg)" stroke="#cbd5e1" stroke-width="1"/>
  <text x="190" y="20" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="11" font-weight="600" fill="#111827">Keypad matrix — High-Z row scan (no diodes)</text>

  <text x="178" y="42" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="8" fill="#334155">GP10</text>
  <text x="178" y="52" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="7" fill="#64748b">KP_COL1</text>
  <text x="238" y="42" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="8" fill="#334155">GP11</text>
  <text x="238" y="52" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="7" fill="#64748b">KP_COL2</text>
  <text x="298" y="42" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="8" fill="#334155">GP12</text>
  <text x="298" y="52" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="7" fill="#64748b">KP_COL3</text>

  <path d="M 178 56 V 198" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
  <path d="M 238 56 V 198" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
  <path d="M 298 56 V 198" fill="none" stroke="#94a3b8" stroke-width="1.2"/>

  <text x="68" y="58" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="7" fill="#64748b">idle Hi-Z / scan LOW</text>

  <text x="8" y="82" font-family="Consolas, Menlo, monospace" font-size="8" fill="#1d4ed8">GP6</text>
  <text x="8" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="7" fill="#64748b">KP_ROW1</text>
  <path d="M 48 84 H 312" fill="none" stroke="#1f2937" stroke-width="1.3"/>
  <use href="#key" x="178" y="84"/>
  <text x="178" y="88" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" font-weight="600" fill="#111827">&lt;</text>
  <use href="#key" x="238" y="84"/>
  <text x="238" y="88" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" font-weight="600" fill="#111827">D</text>
  <use href="#key" x="298" y="84"/>
  <text x="298" y="88" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" font-weight="600" fill="#111827">&gt;</text>

  <text x="8" y="118" font-family="Consolas, Menlo, monospace" font-size="8" fill="#1d4ed8">GP7</text>
  <text x="8" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="7" fill="#64748b">KP_ROW2</text>
  <path d="M 48 120 H 312" fill="none" stroke="#1f2937" stroke-width="1.3"/>
  <use href="#key" x="178" y="120"/>
  <text x="178" y="124" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" font-weight="600" fill="#111827">&lt;&lt;</text>
  <use href="#key" x="238" y="120"/>
  <text x="238" y="124" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" font-weight="600" fill="#111827">T</text>
  <use href="#key" x="298" y="120"/>
  <text x="298" y="124" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" font-weight="600" fill="#111827">&gt;&gt;</text>

  <text x="8" y="154" font-family="Consolas, Menlo, monospace" font-size="8" fill="#1d4ed8">GP8</text>
  <text x="8" y="164" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="7" fill="#64748b">KP_ROW3</text>
  <path d="M 48 156 H 312" fill="none" stroke="#1f2937" stroke-width="1.3"/>
  <use href="#key" x="178" y="156"/>
  <text x="178" y="160" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" font-weight="600" fill="#111827">A</text>
  <use href="#key" x="238" y="156"/>
  <text x="238" y="160" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" font-weight="600" fill="#111827">B</text>
  <use href="#key" x="298" y="156"/>
  <text x="298" y="160" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" font-weight="600" fill="#111827">C</text>

  <text x="8" y="190" font-family="Consolas, Menlo, monospace" font-size="8" fill="#1d4ed8">GP9</text>
  <text x="8" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="7" fill="#64748b">KP_ROW4</text>
  <path d="M 48 192 H 312" fill="none" stroke="#1f2937" stroke-width="1.3"/>
  <use href="#key" x="178" y="192"/>
  <text x="178" y="196" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" font-weight="600" fill="#111827">*</text>
  <use href="#key" x="238" y="192"/>
  <text x="238" y="196" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" font-weight="600" fill="#111827">0</text>
  <use href="#key" x="298" y="192"/>
  <text x="298" y="196" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10" font-weight="600" fill="#111827">*</text>

  <text x="190" y="230" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="8" fill="#64748b">Both * = OPTION — matrix 0 ORed with discrete BTN_STOP on GP5; matrix * ORed with discrete BTN_OPTION on GP13</text>
</svg>
