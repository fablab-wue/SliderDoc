<svg xmlns="http://www.w3.org/2000/svg" width="620" height="260" viewBox="0 0 620 260" role="img" aria-labelledby="title desc">
  <title id="title">Large stop_approach_hz</title>
  <desc id="desc">A speed-over-time profile with accel, cruise, and a relatively short decel to the final stop.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .axis { stroke: #334155; stroke-width: 2; }
      .grid { stroke: #cbd5e1; stroke-width: 1; }
      .curve { fill: none; stroke: #2563eb; stroke-width: 3; }
      .label { font: 16px sans-serif; fill: #0f172a; }
      .small { font: 13px sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect class="bg" width="620" height="260"/>
  <line class="axis" x1="70" y1="30" x2="70" y2="210"/>
  <line class="axis" x1="70" y1="210" x2="570" y2="210"/>
  <line class="grid" x1="70" y1="70" x2="570" y2="70"/>
  <line class="grid" x1="70" y1="130" x2="570" y2="130"/>
  <line class="grid" x1="70" y1="190" x2="570" y2="190"/>

  <path class="curve" d="M 70 210
    C 120 210, 150 182, 184 146
    C 210 116, 230 90, 255 80
    L 300 80
    L 350 80
    C 420 80, 470 115, 515 170
    C 540 198, 558 208, 570 210"/>

  <line x1="255" y1="80" x2="300" y2="80" stroke="#2563eb" stroke-width="3"/>
  <line x1="300" y1="80" x2="350" y2="80" stroke="#2563eb" stroke-width="3"/>

  <text class="label" x="180" y="42">large floor</text>
  <text class="small" x="18" y="115" transform="rotate(-90 18 115)">speed</text>
  <text class="small" x="290" y="246">time</text>
  <text class="small" x="56" y="226">0</text>
  <text class="small" x="556" y="226">T</text>
</svg>
