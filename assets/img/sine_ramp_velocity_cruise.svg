<svg xmlns="http://www.w3.org/2000/svg" width="620" height="260" viewBox="0 0 620 260" role="img" aria-labelledby="title desc">
  <title id="title">Sine ramp velocity with cruise in the middle</title>
  <desc id="desc">A smooth sine ramp with a flat cruise plateau centered in the middle of the time axis.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .axis { stroke: #334155; stroke-width: 2; }
      .grid { stroke: #cbd5e1; stroke-width: 1; }
      .curve { fill: none; stroke: #2563eb; stroke-width: 3; }
      .label { font: 16px sans-serif; fill: #0f172a; }
      .small { font: 13px sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect class="bg" width="620" height="260"/>
  <line class="axis" x1="70" y1="30" x2="70" y2="210"/>
  <line class="axis" x1="70" y1="210" x2="570" y2="210"/>

  <line class="grid" x1="70" y1="70" x2="570" y2="70"/>
  <line class="grid" x1="70" y1="130" x2="570" y2="130"/>
  <line class="grid" x1="70" y1="190" x2="570" y2="190"/>

  <path class="curve" d="M 70 210
    C 110 210, 150 172, 184 130
    C 213 94, 238 68, 258 56
    L 282 56
    L 338 56
    L 362 56
    C 380 68, 406 94, 434 130
    C 468 172, 506 210, 570 210"/>

  <line x1="282" y1="56" x2="338" y2="56" stroke="#2563eb" stroke-width="3"/>
  <line x1="282" y1="56" x2="282" y2="210" stroke="#2563eb" stroke-width="1.2" opacity="0.2"/>
  <line x1="338" y1="56" x2="338" y2="210" stroke="#2563eb" stroke-width="1.2" opacity="0.2"/>

  <text class="label" x="150" y="42">accel</text>
  <text class="label" x="420" y="42">decel</text>
  <text class="label" x="285" y="38">cruise</text>
  <text class="small" x="18" y="115" transform="rotate(-90 18 115)">velocity</text>
  <text class="small" x="298" y="246">time</text>
  <text class="small" x="56" y="226">0</text>
  <text class="small" x="556" y="226">T</text>
</svg>
