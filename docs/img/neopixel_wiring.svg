<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="165mm" height="100mm" viewBox="0 0 330 200"
     role="img" aria-labelledby="title description">
  <title id="title">Optional WS2812 NeoPixel wiring</title>
  <desc id="description">WS2812 NeoPixel with VDD to 3V3 or 5V, optional 100 nanofarad bypass, DIN through optional 330 ohm from PIN_NEOPIXEL GP18, and shared ground.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfd"/>
      <stop offset="1" stop-color="#eef2f6"/>
    </linearGradient>
    <radialGradient id="pixel" cx="36%" cy="30%" r="72%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.20" stop-color="#5ee7ff"/>
      <stop offset="0.47" stop-color="#57d96b"/>
      <stop offset="0.73" stop-color="#ffd34f"/>
      <stop offset="1" stop-color="#f04464"/>
    </radialGradient>
    <g id="resistor">
      <path d="M 0 0 H 4 L 6 -4 L 10 4 L 14 -4 L 18 4 L 20 0 H 24"
            fill="none" stroke="#1f2937" stroke-width="1.4" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect x="0" y="0" width="330" height="200" rx="6" fill="url(#bg)" stroke="#cbd5e1" stroke-width="1"/>
  <text x="165" y="22" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="11" font-weight="600" fill="#111827">Optional NeoPixel (WS2812)</text>

  <text x="20" y="52" font-family="Consolas, Menlo, monospace" font-size="9" fill="#b45309">3V3 / 5V*</text>
  <path d="M 90 48 H 155" fill="none" stroke="#1f2937" stroke-width="1.4"/>
  <path d="M 155 48 V 62" fill="none" stroke="#1f2937" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- optional bypass (dashed, clear of package) -->
  <path d="M 200 48 H 230" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="2 2"/>
  <path d="M 230 42 V 62 M 238 42 V 62" fill="none" stroke="#64748b" stroke-width="1.6"/>
  <path d="M 234 62 V 130" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="2 2" stroke-linejoin="round"/>
  <text x="244" y="54" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="7.5" fill="#64748b">100 nF opt.</text>

  <rect x="140" y="62" width="90" height="56" rx="4" fill="#111827" stroke="#030712" stroke-width="1.2"/>
  <circle cx="185" cy="90" r="14" fill="url(#pixel)" stroke="#344054" stroke-width="0.8"/>
  <text x="185" y="110" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="8" fill="#e2e8f0">WS2812</text>
  <text x="148" y="74" font-family="Consolas, Menlo, monospace" font-size="7" fill="#94a3b8">VDD</text>
  <text x="148" y="96" font-family="Consolas, Menlo, monospace" font-size="7" fill="#94a3b8">DIN</text>
  <text x="208" y="110" font-family="Consolas, Menlo, monospace" font-size="7" fill="#94a3b8">GND</text>

  <text x="20" y="100" font-family="Consolas, Menlo, monospace" font-size="9" fill="#1d4ed8">GP18</text>
  <text x="20" y="112" font-family="Consolas, Menlo, monospace" font-size="7" fill="#64748b">PIN_NEOPIXEL</text>
  <path d="M 90 96 H 104" fill="none" stroke="#1f2937" stroke-width="1.3"/>
  <use href="#resistor" x="104" y="96"/>
  <text x="106" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="7.5" fill="#64748b">~330 ohm opt.</text>
  <path d="M 128 96 H 140" fill="none" stroke="#1f2937" stroke-width="1.3"/>

  <path d="M 185 118 V 140" fill="none" stroke="#1f2937" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M 160 140 H 210" fill="none" stroke="#1f2937" stroke-width="1.4"/>
  <path d="M 168 146 H 202 M 174 152 H 196 M 180 158 H 190" fill="none" stroke="#1f2937" stroke-width="1.2"/>
  <text x="218" y="144" font-family="Consolas, Menlo, monospace" font-size="9" font-weight="600" fill="#334155">GND</text>

  <text x="165" y="182" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="8" fill="#64748b">* Many 5 V modules accept 3.3 V DIN - RGB on GP2/3/4 stays separate</text>
</svg>
